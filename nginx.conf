server {
    listen 80;
    server_name 202.51.3.46;

    # Logs for debugging
    access_log /var/log/nginx/ipg_access.log;
    error_log /var/log/nginx/ipg_error.log;

    location / {
        # 'middleware' refers to the service name in docker-compose
        proxy_pass http://middleware:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    # Recommended: Route Rafiki Webhooks through Nginx as well
    location /webhook/ {
        proxy_pass http://webhook:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}